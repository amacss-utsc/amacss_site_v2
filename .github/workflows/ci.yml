name: CI Workflow

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URI: postgres://amacss:amacss@localhost:5432/amacss
      PAYLOAD_SECRET: ci-only-test-secret-never-use-in-production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: amacss
          POSTGRES_PASSWORD: amacss
          POSTGRES_DB: amacss
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U amacss"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:security
      # deepmerge's one low advisory is locally patched and covered above.
      - run: pnpm audit --audit-level moderate
      - run: pnpm migrate
      - run: pnpm test:security:integration
      - run: pnpm prod-build
